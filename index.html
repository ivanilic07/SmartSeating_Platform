:root{--background:#faf5e8;--surface:#fff;--surface-secondary:#f8fafc;--text-primary:#181d26;--text-secondary:#333840;--text-muted:#525965;--border:#e0e2e6;--primary:#181d26;--primary-hover:#333840;--accent-blue:#1b61c9;--accent-terracotta:#aa2d00;--accent-green:#0a2e0e;--radius-button:12px;--radius-card:16px;--radius-large:24px;--navy:var(--primary);--ink:var(--text-primary);--gold:var(--accent-blue);--gold2:#dbeafe;--paper:var(--background);--line:var(--border);--muted:var(--text-muted);--white:#fff;--green:var(--accent-green);--red:var(--accent-terracotta);--shadow:0 2px 8px #181d2608}
body,button,input,select,textarea{font-family:Inter,system-ui,sans-serif}body{font-size:16px;color:var(--text-primary);background:var(--background)}.topbar{background:var(--surface);border-color:var(--border);color:var(--text-primary)}.brand,.brand strong{color:var(--text-primary)}.brand strong{font:600 16px Inter,system-ui,sans-serif}.brandmark{background:#181d26;color:#fff}.brand small{color:var(--text-muted)}h1,h2,h3,.side-title{font-family:Inter,system-ui,sans-serif;color:var(--text-primary)}h1{font-size:30px;font-weight:600}.hero h1{font-family:Inter,system-ui,sans-serif;font-weight:600}.eyebrow{color:var(--text-muted)}.intro,.subtle,.meta{color:var(--text-muted)}
.btn{min-height:40px;border:1px solid var(--border);border-radius:var(--radius-button);background:#fff;color:var(--text-primary);font-size:14px;font-weight:500;box-shadow:none}.btn:hover{transform:none;background:var(--surface-secondary);border-color:#aeb4be;box-shadow:none}.btn.primary,.btn.gold,#newPlan,#newPlanEmpty,#addTable,#exportProject{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover,.btn.gold:hover,#newPlan:hover,#newPlanEmpty:hover,#addTable:hover,#exportProject:hover{background:var(--primary-hover);color:#fff}.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #1b61c955;outline-offset:2px}.event-card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow)}.event-card:hover{border-color:#c4cad3;box-shadow:0 4px 14px #181d2610}.canvas-wrap{background:#f0ece2;background-image:radial-gradient(#181d2618 .7px,transparent .7px);background-size:20px 20px;border:1px solid #d9d5cc;border-radius:16px;box-shadow:none}.venue{background:#fff;border:1px solid #d6d9df;box-shadow:0 2px 8px #181d2608}.table-node .table-body{border:1.5px solid #bac1cb;box-shadow:0 1px 3px #181d260d}.table-node.selected .table-body{border-color:var(--accent-blue);box-shadow:0 0 0 3px #1b61c925}.table-node.full .table-body{border-color:var(--accent-terracotta)}.left-panel,.right-panel{background:var(--surface);border-color:var(--border);box-shadow:var(--shadow)}.left-panel .count{background:var(--surface-secondary);color:var(--text-secondary)}.left-panel .count b{color:var(--text-primary)}.left-panel .guest{border-color:#e5e7eb;border-radius:10px}.left-panel .guest:hover{border-color:#b4bdcb;background:#fafcff}.left-panel input,.left-panel select,.right-panel input,.right-panel select,.right-panel textarea,.field input,.field select,.field textarea{border-radius:10px;border-color:#d4d8df;background:#fff;color:var(--text-primary)}.palette-item{border-color:#e0e2e6;border-radius:12px;background:var(--surface-secondary);color:var(--text-primary)}.palette-item span{color:var(--accent-blue)}.palette-item.palette-young{background:#f2f6fc;border-color:#b9c8df}.canvas-tools{background:#fff;border-color:#e0e2e6;border-radius:12px;box-shadow:0 2px 6px #181d2608}.dialog{border-radius:16px;border:1px solid var(--border)}.shape-option{border-color:var(--border);border-radius:12px}.shape-option.active{border-color:var(--accent-blue);background:#f3f7fd}.toast{background:#181d26;border-radius:12px}.mobile-nav{background:#fff;border-color:var(--border)}.mobile-nav button{color:#333840}.mobile-nav button.active{background:#edf3fc;color:#181d26}
.bulk-setup-card{padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--surface-secondary);margin:12px 0}.bulk-setup-card h3{font-size:20px;margin-bottom:6px}.bulk-setup-card .field{margin:8px 0}.capacity-counts{display:grid;grid-template-columns:1fr 1fr}.capacity-warning{padding:8px 10px;border-radius:10px;background:#fff1ed;color:#aa2d00;font-size:13px}.bulk-table-list{max-height:220px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 0}.bulk-table-list label{font-size:13px;padding:5px}.capacity-preview{padding:12px;background:#fff;border:1px solid var(--border);border-radius:12px;font-weight:600;margin:12px 0;color:var(--text-primary)}.setup-created{color:var(--accent-green);font-size:14px}.bulk-setup-card button{margin:4px 6px 0 0}

<body><header class="topbar"><div class="brand"><div class="brandmark">B</div><div><strong>Blue Hotel</strong><small>Planer sedenja</small></div></div><div class="top-actions"><span id="saveState" class="save-state">Sačuvano</span><button class="btn small" id="homeBtn">Moji planovi</button></div></header><main class="page" id="app"></main><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{'use strict';
const KEY='blue-hotel-smart-seating-v1';let plans=[],activeId=null,selectedTable=null,selectedElement=null,step=1,createDraft={},csvRows=[],csvHeaders=[],dragGuest=null,saveTimer,panX=0,panY=0,panMode=false,panDrag=null,viewZoom=1,viewPlanId=null,leftPanelOpen=true,rightPanelOpen=true,undoStack=[],redoStack=[],historyBaseline='',historyApplying=false,canvasPointers=new Map(),fitPending=true;
const app=document.getElementById('app'),modalRoot=document.getElementById('modalRoot');
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=()=>{try{plans=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{plans=[]}plans.forEach(p=>{if(!Array.isArray(p.tables))p.tables=[];if(!Array.isArray(p.guests))p.guests=[];if(!Array.isArray(p.elements))p.elements=[];p.tables.forEach((t,i)=>{if(!Number.isFinite(t.initialX))t.initialX=10+(i%4)*21;if(!Number.isFinite(t.initialY))t.initialY=15+Math.floor(i/4)*25;if(t.x>=96&&t.y>=94){t.x=t.initialX;t.y=t.initialY}})});historyBaseline=historySnapshot()};
const historySnapshot=()=>JSON.stringify(plans),historyComparable=s=>JSON.stringify(JSON.parse(s||'[]').map(({updatedAt,...p})=>p));
function updateHistoryButtons(){const u=document.getElementById('undoAction'),r=document.getElementById('redoAction');if(u)u.disabled=!undoStack.length;if(r)r.disabled=!redoStack.length}
function persist(){const snapshot=historySnapshot();if(historyBaseline&&historyComparable(snapshot)!==historyComparable(historyBaseline)&&!historyApplying){undoStack.push(historyBaseline);if(undoStack.length>60)undoStack.shift();redoStack=[];historyBaseline=snapshot;updateHistoryButtons()}let s=document.getElementById('saveState');if(s){s.textContent='Čuvanje…';s.classList.add('saving')}clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(plans));historyApplying=false;historyBaseline=historySnapshot();updateHistoryButtons();if(s){s.textContent='Sačuvano';s.classList.remove('saving')}}catch{toast('Čuvanje nije uspelo. Proverite prostor u pregledaču.')}},260)}
function applyHistory(direction){const from=direction==='undo'?undoStack:redoStack,to=direction==='undo'?redoStack:undoStack;if(!from.length)return;to.push(historyBaseline);historyBaseline=from.pop();plans=JSON.parse(historyBaseline||'[]');historyApplying=true;if(activeId&&!plans.some(p=>p.id===activeId)){activeId=null;selectedTable=null;selectedElement=null}if(activeId){selectedTable=plans.find(p=>p.id===activeId)?.tables.some(t=>t.id===selectedTable)?selectedTable:null;selectedElement=plans.find(p=>p.id===activeId)?.elements.some(x=>x.id===selectedElement)?selectedElement:null}updateHistoryButtons();if(activeId)editor();else dashboard();persist()}
function toast(msg){document.getElementById('toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>document.getElementById('toastRoot').innerHTML='',2700)}
function current(){return plans.find(p=>p.id===activeId)}function dateFmt(d){if(!d)return'Bez datuma';try{return new Date(d+'T12:00:00').toLocaleDateString('sr-Latn',{day:'numeric',month:'long',year:'numeric'})}catch{return d}}
function dashboard(){app.classList.remove('editor-page');activeId=null;document.getElementById('homeBtn').classList.add('hide');app.innerHTML=`<section class="hero"><div><div class="eyebrow">Dobro došli u Blue Hotel</div><h1>Prostor za vaš poseban dan.</h1><p class="intro">Napravite raspored sedenja za nekoliko jednostavnih koraka. Dodajte prostor, stolove i goste, pa zajedno osmislite savršen raspored.</p></div><button class="btn primary" id="newPlan">＋ Napravite novi raspored</button></section><div class="dashboard-title"><div><h2>Moji planovi</h2><span class="subtle">Vaši planovi sedenja sačuvani su na ovom uređaju.</span></div></div><div id="planCards"></div>`;
const wrap=document.getElementById('planCards');if(!plans.length){wrap.innerHTML=`<div class="empty"><div class="icon">✳</div><h3>Vaš prvi plan počinje ovde</h3><p>Unesite detalje proslave, dodajte stolove i rasporedite goste.</p><button class="btn gold" id="newPlanEmpty">Kreirajte plan</button></div>`;document.getElementById('newPlanEmpty').onclick=startCreate}else wrap.innerHTML=`<div class="cards">${plans.map(p=>`<article class="event-card" data-open="${p.id}"><h3>${esc(p.name)}</h3><div class="meta">${dateFmt(p.date)}${p.venueName?' · '+esc(p.venueName):''}</div><div class="card-stats"><span>♧ ${p.guests.length} gostiju</span><span>▤ ${p.tables.length} stolova</span></div><div class="card-foot"><span class="subtle">Izmenjeno ${new Date(p.updatedAt).toLocaleDateString('sr-Latn')}</span><span class="card-actions"><button class="btn small primary" data-open-plan="${p.id}">Otvori plan</button><button class="btn small" data-duplicate="${p.id}">Dupliraj</button><button class="btn small danger" data-delete="${p.id}">Obriši</button></span></div></article>`).join('')}</div>`;
document.getElementById('newPlan').onclick=startCreate;wrap.querySelectorAll('[data-open]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-duplicate],[data-delete]'))return;activeId=x.dataset.open;selectedTable=null;editor()});wrap.querySelectorAll('[data-duplicate]').forEach(b=>b.onclick=e=>{e.stopPropagation();const p=plans.find(x=>x.id===b.dataset.duplicate);let n=JSON.parse(JSON.stringify(p));n.id=uid();n.name+=' — kopija';n.guests=n.guests.map(g=>({...g,id:uid()}));n.tables=n.tables.map(t=>({...t,id:uid()}));n.guests.forEach(g=>g.tableId=null);n.updatedAt=new Date().toISOString();plans.unshift(n);persist();dashboard();toast('Plan je dupliran')});wrap.querySelectorAll('[data-delete]').forEach(b=>b.onclick=e=>{e.stopPropagation();confirmDialog('Obrisati plan?','Plan i svi njegovi podaci biće uklonjeni.',()=>{plans=plans.filter(p=>p.id!==b.dataset.delete);persist();dashboard()})});}
function startCreate(){createDraft={name:'',date:'',venueName:'',venueShape:'rectangle',roomWidth:20,roomHeight:14,tables:[],guests:[]};step=1;wizard()}
function wizard(){const titles=['Detalji proslave','Prostor','Stolovi','Gosti'];modalRoot.innerHTML=`<div class="dialog-backdrop"><div class="dialog"><div class="eyebrow">Novi plan · korak ${step} od 4</div><h2>${titles[step-1]}</h2><div class="steps">${titles.map((x,i)=>`<span class="step ${i+1===step?'active':''}">${i+1}. ${x}</span>`).join('')}</div><div id="wizardBody">${wizardContent()}</div><div class="dialog-actions"><button class="btn" id="cancelWizard">Otkaži</button>${step>1?'<button class="btn" id="wizardBack">Nazad</button>':''}<button class="btn primary" id="wizardNext">${step===4?'Kreiraj plan':'Nastavi →'}</button></div></div></div>`;
document.getElementById('cancelWizard').onclick=()=>modalRoot.innerHTML='';if(step===2)modalRoot.querySelectorAll('[data-shape]').forEach(el=>el.onclick=()=>{saveWizardStep();createDraft.venueShape=el.dataset.shape;wizard()});if(step===3){const bulk=document.getElementById('bulkCreateInitial');if(bulk)bulk.onclick=()=>{const count=+document.getElementById('initialTableCount').value,seats=+document.getElementById('initialSeatCount').value,shape=document.getElementById('initialTableShape').value;if(!Number.isInteger(count)||count<1||count>100){toast('Broj stolova mora biti ceo broj od 1 do 100');return}if(!Number.isInteger(seats)||seats<1||seats>30){toast('Broj mesta mora biti ceo broj od 1 do 30');return}createDraft.tables=Array.from({length:count},(_,i)=>({id:uid(),name:'Sto '+(i+1),shape,capacity:seats,x:50,y:50,initialX:50,initialY:50,rotation:0,autoGrid:true}));wizard()};['initialTableCount','initialSeatCount','initialTableShape'].forEach(id=>document.getElementById(id)?.addEventListener('input',updateInitialTablePreview));updateInitialTablePreview();document.getElementById('addWizardTable')?.addEventListener('click',()=>{saveWizardStep();createDraft.tables.push({id:uid(),name:'Sto '+(createDraft.tables.length+1),shape:'round',capacity:8});wizard()});modalRoot.querySelectorAll('[data-tremove]').forEach(b=>b.onclick=()=>{saveWizardStep();createDraft.tables.splice(+b.dataset.tremove,1);wizard()});modalRoot.querySelectorAll('[data-tname],[data-tcap],[data-tshape]').forEach(el=>el.onchange=()=>saveWizardStep())}if(step>1)document.getElementById('wizardBack').onclick=()=>{saveWizardStep();step--;wizard()};document.getElementById('wizardNext').onclick=()=>{if(!saveWizardStep())return;if(step<4){step++;wizard()}else{const p={id:uid(),...createDraft,elements:[],updatedAt:new Date().toISOString()};plans.unshift(p);activeId=p.id;modalRoot.innerHTML='';persist();editor();toast('Plan je kreiran')}};if(step===4){document.getElementById('addOneGuest').onclick=()=>{modalRoot.innerHTML=`<div class="dialog-backdrop"><div class="dialog" style="width:min(420px,100%)"><h2>Dodaj gosta</h2><div class="field"><label>Ime *</label><input id="dfn"></div><div class="field"><label>Prezime *</label><input id="dln"></div><div class="field"><label>Napomena</label><input id="dnote"></div><div class="dialog-actions"><button class="btn" id="dcancel">Otkaži</button><button class="btn primary" id="dadd">Dodaj</button></div></div></div>`;document.getElementById('dcancel').onclick=()=>wizard();document.getElementById('dadd').onclick=()=>{let a=document.getElementById('dfn').value.trim(),b=document.getElementById('dln').value.trim();if(!a||!b){toast('Unesite ime i prezime');return}createDraft.guests.push({id:uid(),firstName:a,lastName:b,notes:document.getElementById('dnote').value.trim(),tableId:null});wizard()}};document.getElementById('pickCsv').onclick=()=>{let i=document.createElement('input');i.type='file';i.accept='.csv,text/csv';i.onchange=()=>i.files[0]&&readCsv(i.files[0],true);i.click()};document.getElementById('wizardGuests').textContent=createDraft.guests.length?`Dodato gostiju: ${createDraft.guests.length}`:''}}
function wizardContent(){if(step===1)return`<div class="field"><label>Naziv proslave *</label><input id="wName" placeholder="Na primer, Ana i Marko" value="${esc(createDraft.name)}"></div><div class="field"><label>Datum</label><input type="date" id="wDate" value="${esc(createDraft.date)}"></div><div class="field"><label>Naziv prostora (opciono)</label><input id="wVenue" placeholder="Na primer, Velika sala" value="${esc(createDraft.venueName)}"></div>`;
if(step===2)return`<p class="subtle">Izaberite oblik sale. Dimenzije možete prilagoditi kasnije.</p><div class="shape-options">${[['rectangle','Pravougaona'],['square','Kvadratna'],['lshape','U obliku slova L']].map(([v,n])=>`<div class="shape-option ${createDraft.venueShape===v?'active':''}" data-shape="${v}"><div class="shape-preview ${v}"></div><b>${n}</b></div>`).join('')}</div><div class="table-config" style="margin-top:18px"><div class="field"><label>Širina (m)</label><input type="number" id="wWidth" min="5" max="100" value="${createDraft.roomWidth}"></div><div class="field"><label>Dužina (m)</label><input type="number" id="wHeight" min="5" max="100" value="${createDraft.roomHeight}"></div></div>`;
if(step===3)return`<section class="bulk-setup-card"><h3>Podešavanje stolova</h3><p class="subtle">Unesite broj stolova i broj mesta po stolu.</p><div class="table-config"><div class="field"><label for="initialTableCount">Broj stolova</label><input id="initialTableCount" type="number" inputmode="numeric" min="1" max="100" step="1" value="${Math.max(1,createDraft.tables.length||25)}"></div><div class="field"><label for="initialSeatCount">Broj mesta po stolu</label><input id="initialSeatCount" type="number" inputmode="numeric" min="1" max="30" step="1" value="${createDraft.tables[0]?.capacity||10}"></div><div class="field"><label for="initialTableShape">Oblik stolova</label><select id="initialTableShape"><option value="round">Okrugli</option><option value="rect">Pravougaoni</option><option value="banquet">Banket stolovi</option></select></div></div><div id="initialTablePreview" class="capacity-preview"></div>${createDraft.tables.length?`<p class="setup-created">Pripremljeno ${createDraft.tables.length} stolova. Možete nastaviti ili podesiti novi broj i oblik.</p>`:''}<button class="btn primary" id="bulkCreateInitial">Kreiraj stolove</button><button class="btn small" id="addWizardTable">Dodaj pojedinačni sto</button></section><div id="tableRows">${createDraft.tables.length?`<details><summary>Prilagodi nazive i pojedinačne kapacitete (${createDraft.tables.length})</summary>${createDraft.tables.slice(0,100).map((t,i)=>tableRow(t,i)).join('')}</details>`:''}</div>`;
return`<p class="subtle">Plan možete kreirati odmah, a goste dodati ručno ili uvesti CSV datoteku kasnije.</p><div class="shape-options"><div class="shape-option active"><div style="font-size:25px;margin:8px">♧</div><b>Dodajte kasnije</b></div><div class="shape-option" id="pickCsv"><div style="font-size:25px;margin:8px">⇧</div><b>Uvezite CSV</b></div><div class="shape-option" id="addOneGuest"><div style="font-size:25px;margin:8px">＋</div><b>Dodajte gosta</b></div></div><div id="wizardGuests" class="footnote" style="margin-top:14px"></div>`}
function updateInitialTablePreview(){const n=+document.getElementById('initialTableCount')?.value||0,seats=+document.getElementById('initialSeatCount')?.value||0,shape=document.getElementById('initialTableShape')?.value||'round',label=shape==='round'?'okruglih':shape==='rect'?'pravougaonih':'banket';const el=document.getElementById('initialTablePreview');if(el)el.textContent=`${n} ${label} stolova · ${seats} mesta po stolu · Ukupan kapacitet: ${n*seats} gostiju`}

function saveWizardStep(){if(step===1){createDraft.name=document.getElementById('wName').value.trim();createDraft.date=document.getElementById('wDate').value;createDraft.venueName=document.getElementById('wVenue').value.trim();if(!createDraft.name){toast('Unesite naziv proslave');return false}}if(step===2){createDraft.roomWidth=+document.getElementById('wWidth').value||20;createDraft.roomHeight=+document.getElementById('wHeight').value||14}if(step===3){if(!document.querySelector('[data-tname]')){const countInput=document.getElementById('initialTableCount'),seatInput=document.getElementById('initialSeatCount'),shapeInput=document.getElementById('initialTableShape');if(!countInput||!seatInput||!shapeInput)return true;const count=+countInput.value,seats=+seatInput.value,shape=shapeInput.value;if(!Number.isInteger(count)||count<1||count>100){toast('Broj stolova mora biti ceo broj od 1 do 100');return false}if(!Number.isInteger(seats)||seats<1||seats>30){toast('Broj mesta mora biti ceo broj od 1 do 30');return false}createDraft.tables=Array.from({length:count},(_,i)=>({id:uid(),name:'Sto '+(i+1),shape,capacity:seats,x:50,y:50,initialX:50,initialY:50,rotation:0,autoGrid:true}));return true}createDraft.tables=[...document.querySelectorAll('[data-tname]')].map((x,i)=>{const old=createDraft.tables[i]||{},px=Number.isFinite(old.x)?old.x:10+(i%4)*21,py=Number.isFinite(old.y)?old.y:15+Math.floor(i/4)*25;return{...old,id:old.id||uid(),name:x.value.trim()||'Sto '+(i+1),shape:document.querySelector(`[data-tshape="${i}"]`).value,capacity:Math.max(1,+document.querySelector(`[data-tcap="${i}"]`).value||8),x:px,y:py,initialX:Number.isFinite(old.initialX)?old.initialX:px,initialY:Number.isFinite(old.initialY)?old.initialY:py,rotation:old.rotation||0,autoGrid:!!old.autoGrid}})}return true}

function elementDialog(){modalRoot.innerHTML=`<div class="dialog-backdrop"><div class="dialog" style="width:min(430px,100%)"><h2>Dodaj element prostora</h2><p class="subtle">Izaberite element, pa ga prevucite na željeno mesto.</p><div class="shape-options">${['Bina / bend','Plesni podijum','Ulaz','Bife','Mladenački sto'].map(x=>`<div class="shape-option" data-element="${x}"><div style="font-size:23px;margin:7px">${x.includes('Bina')?'♫':x==='Ulaz'?'↗':x==='Bife'?'◇':x==='Mladenački sto'?'▰':'▧'}</div><b>${x}</b></div>`).join('')}</div><div class="dialog-actions"><button class="btn" id="elCancel">Zatvori</button></div></div></div>`;document.getElementById('elCancel').onclick=()=>modalRoot.innerHTML='';modalRoot.querySelectorAll('[data-element]').forEach(el=>el.onclick=()=>{let type=el.dataset.element;modalRoot.innerHTML='';addLayoutElement(type)})}
function autoAssign(){const p=current(),free=p.guests.filter(g=>!g.tableId),capacity=p.tables.reduce((n,t)=>n+Math.max(0,t.capacity-p.guests.filter(g=>g.tableId===t.id).length),0);if(!free.length){toast('Svi gosti su već raspoređeni.');return}confirmDialog('Automatski rasporediti goste?',`${free.length} neraspoređenih gostiju biće raspoređeno redom po dostupnim mestima. Postojeći raspored ostaje sačuvan. Slobodnih mesta: ${capacity}.`,()=>{let left=free.length;for(const t of p.tables){let slots=Math.max(0,t.capacity-p.guests.filter(g=>g.tableId===t.id).length);for(const g of free){if(!left)break;if(!g.tableId&&slots>0){g.tableId=t.id;slots--;left--}}}persist();editor();toast(`${free.length-left} gostiju raspoređeno${left?`; ${left} nije moglo biti raspoređeno`:''}`)})}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let first=text.split(/\r?\n/,1)[0]||'',delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';let rows=[],row=[],cell='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'&&quote&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quote=!quote;else if(c===delim&&!quote){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell.trim());if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.trim());if(row.some(x=>x!==''))rows.push(row);return rows}
function readCsv(file,draft=false){const reader=new FileReader();reader.onload=()=>{let rows=parseCSV(String(reader.result||''));if(rows.length<2){toast('CSV datoteka nema redove sa podacima.');return}showCsvMapping(rows,draft,file.name)};reader.onerror=()=>toast('Datoteku nije moguće pročitati.');reader.readAsText(file,'UTF-8')}
function showCsvMapping(rows,draft,filename){let headers=rows[0],data=rows.slice(1),sel=(id,auto)=>`<select id="${id}"><option value="-1">— preskoči —</option>${headers.map((h,i)=>`<option value="${i}" ${auto(h)?'selected':''}>${esc(h||'Kolona '+(i+1))}</option>`).join('')}</select>`,autoFirst=h=>/^(ime|first.?name|name)$/i.test(h.trim()),autoLast=h=>/^(prezime|last.?name|surname|family.?name)$/i.test(h.trim()),autoNotes=h=>/napomen|notes|comment/i.test(h.trim());let preview=data.slice(0,4);modalRoot.innerHTML=`<div class="dialog-backdrop"><div class="dialog"><div class="eyebrow">Uvoz CSV · ${esc(filename)}</div><h2>Proverite kolone</h2><p class="subtle">Izaberite kolone za ime i prezime. Tekst se čita kao UTF-8, uključujući srpska slova. Prazni redovi se preskaču; neispravni redovi biće prikazani pre uvoza.</p><div class="table-config"><div class="field"><label>IME *</label>${sel('csvFirst',autoFirst)}</div><div class="field"><label>PREZIME *</label>${sel('csvLast',autoLast)}</div><div class="field"><label>NAPOMENA</label>${sel('csvNotes',autoNotes)}</div></div><div class="csv-preview"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${preview.map(r=>`<tr>${headers.map((_,i)=>`<td>${esc(r[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div id="csvValidation" class="footnote" style="margin-top:10px"></div><div class="dialog-actions"><button class="btn" id="csvCancel">Otkaži</button><button class="btn primary" id="csvDoImport">Uvezi goste</button></div></div></div>`;document.getElementById('csvCancel').onclick=()=>modalRoot.innerHTML='';document.getElementById('csvDoImport').onclick=()=>{let a=+document.getElementById('csvFirst').value,b=+document.getElementById('csvLast').value,n=+document.getElementById('csvNotes').value;if(a<0||b<0||a===b){toast('Izaberite različite kolone za ime i prezime');return}let valid=[],invalid=[];data.forEach((r,i)=>{let first=(r[a]||'').trim(),last=(r[b]||'').trim();if(!first||!last)invalid.push({line:i+2,values:r.join(' · ')});else valid.push({id:uid(),firstName:first,lastName:last,notes:n>=0?(r[n]||'').trim():'',tableId:null})});let target=draft?createDraft.guests:current().guests;let seen=new Set(target.map(x=>(x.firstName+' '+x.lastName).toLocaleLowerCase('sr-Latn'))),dup=valid.filter(g=>{let key=(g.firstName+' '+g.lastName).toLocaleLowerCase('sr-Latn');if(seen.has(key))return true;seen.add(key);return false});let summary=`Spremno za uvoz: ${valid.length} · Neispravni redovi: ${invalid.length} · Mogući duplikati: ${dup.length}`;document.getElementById('csvValidation').innerHTML=`${esc(summary)}${invalid.length?'<br>'+invalid.slice(0,8).map(x=>`Red ${x.line}: ${esc(x.values||'(prazno ime ili prezime)')}`).join('<br>')+(invalid.length>8?`<br>i još ${invalid.length-8} redova`:'' ):''}${dup.length?'<br>Duplikati su obeleženi i neće biti uvezeni ponovo.':''}`;if(!valid.length){toast('Nema ispravnih redova za uvoz');return}if(!document.getElementById('csvDoImport').dataset.ready){document.getElementById('csvDoImport').dataset.ready='1';document.getElementById('csvDoImport').textContent='Potvrdi uvoz';return}let added=valid.filter(g=>!dup.includes(g));if(draft){createDraft.guests.push(...added);wizard()}else{current().guests.push(...added);modalRoot.innerHTML='';persist();editor();toast(`Uvezeno gostiju: ${added.length}${invalid.length?`; preskočeno neispravnih redova: ${invalid.length}`:''}`)}}}
function downloadTemplate(){const blob=new Blob(['\uFEFFIme,Prezime,Napomena\r\nMilica,Petrović,Vegetarijanski meni\r\nNikola,Jovanović,'],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='primer-spisak-gostiju.csv';a.click();URL.revokeObjectURL(a.href)}
function exportPlan(mode){const p=current(),free=p.guests.filter(g=>!g.tableId);if(free.length){confirmDialog('Ima neraspoređenih gostiju',`${free.length} gostiju nema dodeljen sto. Možete nastaviti sa izvozom.`,()=>printPlan(mode));return}printPlan(mode)}
function printPlan(mode){const p=current(),win=window.open('','_blank');if(!win){toast('Dozvolite iskačući prozor za štampu i PDF izvoz.');return}let base=`<html lang="sr-Latn"><meta charset="utf-8"><title>${esc(p.name)} - ${mode==='project'?'Kompletan plan sedenja':'Raspored i spisak'} · Blue Hotel</title><style>@page{size:A4;margin:16mm}*{box-sizing:border-box}body{font:12px Arial,sans-serif;color:#172b3b;margin:0}h1{font:26px Georgia;color:#102943;margin:4px 0}h2{font:18px Georgia;color:#102943}header{border-bottom:2px solid #d9a95e;padding-bottom:12px;margin-bottom:18px}.brand{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#a57838}p{color:#68737b}.foot{margin-top:22px;border-top:1px solid #ddd;padding-top:9px;color:#889098;font-size:9px}.map{position:relative;height:620px;border:2px solid #d8d4ca;background:#fbfaf7;margin:15px 0}.tbl{position:absolute;transform:translate(-50%,-50%);width:110px;min-height:62px;border:2px solid #cfbd9e;border-radius:12px;background:white;text-align:center;padding:12px 5px;font-size:10px}.tbl.round{width:78px;height:78px;border-radius:50%;display:grid;place-content:center}.tbl b{display:block}.tbl.rect{width:108px;height:70px;border-radius:10px}.tbl.banquet{width:142px;height:62px;border-radius:9px}.map.lshape{clip-path:polygon(0 0,100% 0,100% 58%,58% 58%,58% 100%,0 100%)}.map-label{position:absolute;left:50%;top:3%;transform:translateX(-50%);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#a39c8f}.map-element{position:absolute;display:grid;place-items:center;border:1px dashed #89959c;border-radius:6px;background:#e9edef;color:#53616a;font-size:9px;padding:3px;text-align:center}.page-break{break-before:page;page-break-before:always}.section-title{margin-top:24px}.summary{padding:10px 12px;background:#f5f4f0;border-left:3px solid #d9a95e;color:#53616a}.guesttable{width:100%;border-collapse:collapse;margin-top:16px}.guesttable th,.guesttable td{text-align:left;border-bottom:1px solid #ddd;padding:8px}.guesttable th{background:#f5f4f0;color:#102943}.guesttable tr{break-inside:avoid}</style><header><div class="brand">Blue Hotel Bend · Planer sedenja</div><h1>${esc(p.name)}</h1><p>${dateFmt(p.date)}${p.venueName?' · '+esc(p.venueName):''} · ${p.guests.length} gostiju</p></header>`;if(mode==='project'){
 const gs=[...p.guests].sort((a,b)=>a.lastName.localeCompare(b.lastName,'sr-Latn')||a.firstName.localeCompare(b.firstName,'sr-Latn'));
 const shapeName=p.venueShape==='lshape'?'Sala u obliku slova L':p.venueShape==='square'?'Kvadratna sala':'Pravougaona sala';
 const nodes=p.tables.map(t=>{const count=p.guests.filter(g=>g.tableId===t.id).length;return `<div class="tbl ${t.shape}" style="left:${t.x}%;top:${t.y}%;transform:translate(-50%,-50%) rotate(${t.rotation||0}deg)"><b>${esc(t.name)}</b><small>${count} / ${t.capacity} mesta</small></div>`}).join('');
 const elements=p.elements.map(e=>`<div class="map-element" style="left:${e.x}%;top:${e.y}%;width:${e.w}px;height:${e.h}px;transform:translate(-50%,-50%) rotate(${e.rotation||0}deg)">${esc(e.type)}</div>`).join('');
 const tableRows=p.tables.map(t=>{const gsForTable=p.guests.filter(g=>g.tableId===t.id),shape=t.shape==='round'?'Okrugli':t.shape==='rect'?'Pravougaoni':'Banket';return `<tr><td>${esc(t.name)}</td><td>${shape}</td><td>${gsForTable.length} / ${t.capacity}</td><td>${gsForTable.map(g=>`${esc(g.firstName)} ${esc(g.lastName)}`).join(', ')||'—'}</td></tr>`}).join('');
 const guestRows=gs.map(g=>`<tr><td>${esc(g.firstName)}</td><td>${esc(g.lastName)}</td><td>${esc(p.tables.find(t=>t.id===g.tableId)?.name||'Neraspoređen')}</td><td>${esc(g.notes||'—')}</td></tr>`).join('');
 base+=`<div class="summary"><b>${shapeName}</b> · ${p.roomWidth} × ${p.roomHeight} m · ${p.tables.length} stolova · ${p.guests.length} gostiju · ${p.guests.filter(g=>g.tableId).length} raspoređenih</div><h2>Raspored sale</h2><div class="map ${p.venueShape}" style="aspect-ratio:${p.roomWidth}/${p.roomHeight};height:auto;min-height:420px;max-height:590px"><div class="map-label">${esc(p.venueName||'Prostor za proslavu')}</div>${elements}${nodes}</div><div class="foot">Blue Hotel · Kompletan plan sedenja</div><section class="page-break"><h2>Pregled stolova</h2><table class="guesttable"><thead><tr><th>Sto</th><th>Oblik</th><th>Zauzeto / kapacitet</th><th>Gosti</th></tr></thead><tbody>${tableRows}</tbody></table><h2 class="section-title">Spisak gostiju</h2><table class="guesttable"><thead><tr><th>Ime</th><th>Prezime</th><th>Sto</th><th>Napomena</th></tr></thead><tbody>${guestRows}</tbody></table><div class="foot">Blue Hotel · ${gs.length} gostiju</div></section>`
}else if(mode==='visual'){let els=p.tables.map(t=>`<div class="tbl ${t.shape}" style="left:${t.x}%;top:${t.y}%"><b>${esc(t.name)}</b>${p.guests.filter(g=>g.tableId===t.id).map(g=>`${esc(g.firstName)} ${esc(g.lastName)}`).join('<br>')}<br><small>${p.guests.filter(g=>g.tableId===t.id).length}/${t.capacity} mesta</small></div>`).join('');base+=`<h2>Raspored sale</h2><div class="map">${els}</div><div class="foot">Blue Hotel · Plan rasporeda sedenja</div>`}else{let gs=[...p.guests].sort((a,b)=>a.lastName.localeCompare(b.lastName,'sr-Latn')||a.firstName.localeCompare(b.firstName,'sr-Latn'));base+=`<h2>Spisak gostiju</h2><table class="guesttable"><thead><tr><th>Ime</th><th>Prezime</th><th>Sto</th></tr></thead><tbody>${gs.map(g=>`<tr><td>${esc(g.firstName)}</td><td>${esc(g.lastName)}</td><td>${esc(p.tables.find(t=>t.id===g.tableId)?.name||'Neraspoređen')}</td></tr>`).join('')}</tbody></table><div class="foot">Blue Hotel · Spisak gostiju · ${gs.length} ukupno</div>`}base+=`<script>window.onload=()=>setTimeout(()=>window.print(),400)<\/script></html>`;win.document.open();win.document.write(base);win.document.close();if(mode==='project')toast('U prozoru za štampu izaberite „Sačuvaj kao PDF“.')}
load();dashboard();
})();
</script></body></html>
